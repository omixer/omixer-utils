plugins {
	id 'java-library'
	id 'eclipse'
	id 'com.vanniktech.maven.publish' version '0.37.0'
}

// Maven Central namespace of the omixer GitHub account; the Java packages stay io.omixer.utils
group = 'io.github.omixer'
version = '1.2.0'

// Minimum Java version for users of the library
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	testImplementation platform('org.junit:junit-bom:6.1.3')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

// Javadoc checks everything except missing comments on self-explanatory members
javadoc {
	options.addBooleanOption('Xdoclint:all,-missing', true)
}

// Maven Central (Central Portal): sources and javadoc jars, signatures, POM. Credentials and signing key come from
// ~/.gradle/gradle.properties or ORG_GRADLE_PROJECT_* variables, never from this repository
mavenPublishing {
	publishToMavenCentral()
	// Central rejects unsigned uploads; a local install (publishToMavenLocal) needs no key
	if (providers.gradleProperty('signingInMemoryKey').isPresent()) {
		signAllPublications()
	}
	coordinates(group, 'omixer-utils', version)
	pom {
		name = 'omixer-utils'
		description = 'Small, generic Java helpers for reading and writing text files, used by Omixer-RPM.'
		inceptionYear = '2018'
		url = 'https://github.com/omixer/omixer-utils'
		licenses {
			license {
				name = 'MIT License'
				url = 'https://opensource.org/licenses/MIT'
			}
		}
		developers {
			developer {
				id = 'omixer'
				name = 'Youssef Darzi'
				url = 'https://github.com/omixer'
			}
		}
		scm {
			url = 'https://github.com/omixer/omixer-utils'
			connection = 'scm:git:https://github.com/omixer/omixer-utils.git'
			developerConnection = 'scm:git:ssh://git@github.com/omixer/omixer-utils.git'
		}
	}
}
