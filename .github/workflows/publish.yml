# Publishes a release to Maven Central when a version tag (v1.2.0, ...) is pushed. The tag must match the version in
# build.gradle. Repository secrets: MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD (a Central Portal user token),
# SIGNING_KEY (gpg --export-secret-keys --armor <key id>), SIGNING_KEY_PASSWORD.
name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # the wrapper jar is not in the repository: use the Gradle version of gradle-wrapper.properties
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'

      - name: Check the tag and the secrets
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          version=$(gradle -q properties --property version | sed -n 's/^version: //p')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in build.gradle"
            exit 1
          fi
          for secret in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY; do
            if [ -z "${!secret}" ]; then
              echo "Repository secret $secret is not set"
              exit 1
            fi
          done

      - name: Build, test and publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle build publishAndReleaseToMavenCentral
